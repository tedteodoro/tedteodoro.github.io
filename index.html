<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito</title>
    
    <!-- Importa a biblioteca de Criptografia Militar AES -->

    <style>
        /* MEDIDA EXTRA 1: Bloqueia seleção de texto e arrastar itens */
        body {
            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
            background-color: #0a0a0a;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .login-container {
            border: 1px solid #00ff00;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
        }
        input, button {
            background: black;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px;
            margin-top: 15px;
            width: 80%;
            outline: none;
        }
        button:hover {
            background: #00ff00;
            color: black;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="login-container" id="tela-login">
        <h2>SISTEMA BILLY</h2>
        <p>Insira a chave de descriptografia:</p>
        <input type="password" id="senha" placeholder="Chave AES...">
        <br>
        <button onclick="desbloquearSistema()">Acessar</button>
    </div>
